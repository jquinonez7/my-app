<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="stripeClip">
      <path d="M300,215 L640,205 L660,300 L280,300 Z" />
    </clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="500" cy="352" rx="440" ry="12" fill="#000000" opacity="0.25" />

  <!-- speed lines -->
  <g stroke="#f2ede2" stroke-width="3" opacity="0.35" stroke-linecap="round">
    <line x1="0" y1="150" x2="120" y2="150" />
    <line x1="0" y1="185" x2="90" y2="185" />
    <line x1="0" y1="220" x2="140" y2="220" />
  </g>

  <!-- body wireframe -->
  <path d="M70,300
           C62,300 58,288 62,275
           C68,255 88,246 118,242
           L200,233
           C250,158 355,105 480,95
           C560,89 630,100 675,132
           L715,168
           L845,182
           C900,188 935,205 945,232
           C950,248 942,265 922,270
           L900,272"
        fill="none" stroke="#f2ede2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- bottom line -->
  <path d="M118,300 L900,300" fill="none" stroke="#f2ede2" stroke-width="6" stroke-linecap="round" />

  <!-- cabin / windows -->
  <path d="M210,231 C255,168 350,122 460,112 C520,107 585,113 630,140 L700,197 L232,233 Z"
        fill="none" stroke="#f2ede2" stroke-width="5" stroke-linejoin="round" />
  <line x1="452" y1="115" x2="470" y2="230" stroke="#f2ede2" stroke-width="4" />

  <!-- mirror -->
  <path d="M228,225 L246,214 L252,226 Z" fill="#f2ede2" />

  <!-- rear spoiler -->
  <path d="M845,182 L878,150 L892,152 L868,186 Z" fill="none" stroke="#f2ede2" stroke-width="5" stroke-linejoin="round" />

  <!-- front kidney grille hint -->
  <rect x="66" y="262" width="8" height="26" rx="4" fill="#f2ede2" />
  <rect x="78" y="262" width="8" height="26" rx="4" fill="#f2ede2" />

  <!-- headlight -->
  <ellipse cx="94" cy="248" rx="12" ry="7" fill="none" stroke="#f2ede2" stroke-width="4" />

  <!-- M stripe -->
  <g clip-path="url(#stripeClip)">
    <rect x="320" y="80" width="22" height="260" fill="#1c69d4" transform="skewX(-18)" />
    <rect x="352" y="80" width="22" height="260" fill="#7b2ff7" transform="skewX(-18)" />
    <rect x="384" y="80" width="22" height="260" fill="#e6002d" transform="skewX(-18)" />
  </g>

  <!-- wheels -->
  <g>
    <circle cx="290" cy="300" r="58" fill="none" stroke="#f2ede2" stroke-width="7" />
    <circle cx="290" cy="300" r="26" fill="none" stroke="#f2ede2" stroke-width="4" />
    <line x1="290" y1="274" x2="290" y2="326" stroke="#f2ede2" stroke-width="3" />
    <line x1="264" y1="300" x2="316" y2="300" stroke="#f2ede2" stroke-width="3" />
    <line x1="271" y1="281" x2="309" y2="319" stroke="#f2ede2" stroke-width="3" />
    <line x1="309" y1="281" x2="271" y2="319" stroke="#f2ede2" stroke-width="3" />
  </g>
  <g>
    <circle cx="770" cy="300" r="58" fill="none" stroke="#f2ede2" stroke-width="7" />
    <circle cx="770" cy="300" r="26" fill="none" stroke="#f2ede2" stroke-width="4" />
    <line x1="770" y1="274" x2="770" y2="326" stroke="#f2ede2" stroke-width="3" />
    <line x1="744" y1="300" x2="796" y2="300" stroke="#f2ede2" stroke-width="3" />
    <line x1="751" y1="281" x2="789" y2="319" stroke="#f2ede2" stroke-width="3" />
    <line x1="789" y1="281" x2="751" y2="319" stroke="#f2ede2" stroke-width="3" />
  </g>
</svg>
